<script>
function setCookie(cname,cvalue,exdays) {
    var d = new Date();
    d.setTime(d.getTime() + (exdays*24*60*60*1000));
    var expires = "expires=" + d.toGMTString();
    document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
}

function getCookie(cname) {
    var name = cname + "=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for(var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') {
            c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
        }
    }
    return "";
}

function mobilecheck() 
{
    // Força a execução direta no PS4 evitando loops de redirecionamento
    checkCookie();
}

function checkCookie() {
    var background = getCookie("background");

    if (background == "") 
    {
        document.body.style.backgroundImage = "url('background.png')";	   	   
    }
    else  
    {
        document.body.style.backgroundImage = "url("+background+")";
    }
	
    // Força o IP e o Link corretos do seu servidor para evitar erros de leitura
    var PS4IP = "192.168.1.2";
    var pkglink = "http://f005.backblazeb2.com/file/storejson/pkgs.json";
    
    setCookie("PS4IP", PS4IP, 365);
    setCookie("pkglink", pkglink, 365);
	
    // Inicializa a barra de buscas e faz a requisição dos jogos
    document.getElementById("searchbar").setAttribute("onkeyup", "search(\""+pkglink+"\")");
    request(pkglink);
}
</script>
