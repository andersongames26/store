<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-16">
<title>Brew Store</title>
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="main.js"></script>
<script>
function mobilecheck() 
{
    checkCookie();
}

function checkCookie() {
    var background = getCookie("background");

    if (background == "") 
    {
        document.body.style.backgroundImage = "url('background.png')";	   	   
    }
    else  
    {
        document.body.style.backgroundImage = "url("+background+")";
    }
	
    // Força o sistema a buscar o arquivo pkgs.json local
    document.getElementById("searchbar").setAttribute("onkeyup", "search(\"pkgs.json\")");
    request("pkgs.json");
}
</script>
</head>
<body onload="mobilecheck()">
<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="index.html">PKG'S</a>
  <a href="settings.html">Settings</a>
  <a href="help.html">Help</a>
</div>
<div class="main">
<span id="nav_button" class="nav_button" onclick="openNav()"><img src="button.png"></span>
<center id="center">
<div id="content" >
<font size="12" id="headline" class="nohover">PKG'S</font></br></br>
<form class="pure-form" onsubmit="event.preventDefault();">
<input id="searchbar" type="text" placeholder="Search">
</form>
</br>
<div id="filter">
<font size="6" id="headline" class="nohover">Filter by Categories</font></br></br>
</div>
</br>
</div>
</center>
</div>
<script>
function openNav() {
    document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
    document.getElementById("mySidenav").style.width = "0";
}
</script>
</body>
</html>
