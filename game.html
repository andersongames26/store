<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-16">
<title>Brew Store - Game info</title>
<link rel="stylesheet" href="style.css">
<script>
var game_id;
var current_game;

function getCookie(cname) {
    var name = cname + "=";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for(var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') {
            c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
        }
    }
    return "";
}

function getUrlParam(param) {
    var urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

function initGame() {
    var background = getCookie("background");
    if (background == "") {
        document.body.style.backgroundImage = "url('background.png')";	   	   
    } else {
        document.body.style.backgroundImage = "url(" + background + ")";
    }

    game_id = getUrlParam("id");
    
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            var games = JSON.parse(this.responseText);
            current_game = games[game_id];
            
            document.getElementById("game-title").innerText = current_game.name;
            document.getElementById("game-icon").src = current_game.icon;
            document.getElementById("game-size").innerText = "Size: " + current_game.size;
            document.getElementById("game-id").innerText = "Title ID: " + current_game.titleid;
            
            if(current_game.description) {
                document.getElementById("game-desc").innerText = current_game.description.join(" ");
            }
        }
    };
    xhttp.open("GET", "pkgs.json", true);
    xhttp.send();
}

function enviarInstalacao() {
    var ps4_ip = getCookie("PS4IP");
    if (!ps4_ip || ps4_ip == "") {
        ps4_ip = "192.168.1.2"; 
    }

    if (!current_game || !current_game.links || current_game.links.length == 0) {
        alert("Erro: Link do PKG não encontrado!");
        return;
    }

    var pkg_url = current_game.links; 

    // Estrutura exata do comando exigido pelo PS4
    var json_payload = {
        "type": "direct",
        "packages": [pkg_url]
    };

    // Cria o formulário em formato texto puro para o navegador do PS4/PC aceitar enviar
    var form = document.createElement("form");
    form.method = "POST";
    form.action = "http://" + ps4_ip + ":12800/api/install";
    form.enctype = "text/plain"; 
    form.target = "submit-iframe"; 

    var input = document.createElement("input");
    input.type = "hidden";
    // Envia o JSON puro sem chaves extras no cabeçalho
    input.name = JSON.stringify(json_payload); 
    form.appendChild(input);

    var iframe = document.getElementById("submit-iframe");
    if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "submit-iframe";
        iframe.name = "submit-iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
    }

    document.body.appendChild(form);
    
    try {
        form.submit();
        alert("Comando enviado para o PS4! Verifique o aplicativo Remote Package Installer na TV.");
    } catch(e) {
        alert("Erro ao disparar sinal: " + e.message);
    }
    
    setTimeout(function() {
        if (form.parentNode) {
            form.parentNode.removeChild(form);
        }
    }, 500);
}
</script>
</head>
<body onload="initGame()">
<div id="mySidenav" class="sidenav">
  <a href="index.html">PKG'S</a>
  <a href="settings.html">Settings</a>
</div>
<div class="main">
<center id="center">
    <div id="content">
        <h1 id="game-title" style="font-size: 32px; color: white; font-family: sans-serif; margin-bottom: 20px;">Carregando...</h1>
        <br>
        <img id="game-icon" src="" style="width: 250px; height: 250px; border-radius: 10px; border: 4px solid white; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);">
        <br><br>
        <p id="game-id" style="font-size: 18px; color: #ccc; font-family: sans-serif;"></p>
        <p id="game-size" style="font-size: 18px; color: #ccc; font-family: sans-serif;"></p>
        <p id="game-desc" style="font-size: 16px; color: #aaa; font-family: sans-serif; max-width: 500px; margin: 15px auto;"></p>
        <br>
        <button onclick="enviarInstalacao()" style="background-color: #0082c3; color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); transition: 0.2s;">
            INSTALAR NO PS4
        </button>
        <br><br>
        <a href="index.html" style="color: #0082c3; text-decoration: none; font-size: 16px; font-family: sans-serif;">← Voltar para a Loja</a>
    </div>
</center>
</div>
</body>
</html>
